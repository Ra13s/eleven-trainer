[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eleven-trainer"
version = "0.2.0"
description = "Build repeatable Eleven Table Tennis ball-machine sessions and transfer them to Quest over ADB."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Eleven Trainer contributors"}]
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]

[project.scripts]
eleven-trainer = "eleven_trainer.cli:main"

[project.urls]
Repository = "https://github.com/Ra13s/eleven-trainer"
Documentation = "https://github.com/Ra13s/eleven-trainer/tree/main/docs"

[tool.setuptools.packages.find]
include = ["eleven_trainer*"]

[tool.setuptools.package-data]
"eleven_trainer.experimental" = ["*.json", "*.md"]
